speakers_heading: Keynote speakers
speakers:
  - id: gerrits
    name: Thomas Gerrits
    affiliation: Heliox Energy, The Netherlands
    role: keynote
    photo: /assets/img/2025/thomas-gerrits.jpg
    title: "Charging energy hubs: system perspective, the added value of DC and how to design a DC grid"
    abstract: >-
      A DC net is a service for third parties, never an end-goal in itself, and there is no clear recipe for it.
      The challenge lies in clarifying the mutual options, dependencies and resulting necessary protections.
      In this talk, the dependencies from product level to system are outlined and DC charging
      application-related examples are presented.
    bio: >-
      Dr. Ir. Thomas Gerrits is a Power Conversion System Architect at Heliox, Eindhoven, the Netherlands.
      He started the study Electrical Engineering at the Eindhoven University of Technology (TU/e) and received
      his M.Sc. degree in 2009. From 2009 to 2010 he worked as a lab assistant in the group of Electromechanics
      and Power Electronics at the Department of Electrical Engineering at the TU/e where he subsequently started
      as Ph.D. candidate. He received his Ph.D. in 2015. Currently he is working in the R&D department of Heliox
      as System Architect, focusing on high power energy conversion.

  - id: niesse
    name: Astrid Nieße
    affiliation: Carl von Ossietzky University Oldenburg & OFFIS, Germany
    role: keynote
    photo: /assets/img/2025/astrid-niesse.jpg
    title: Agent-based control in energy systems
    abstract: >-
      Agent-based control offers transformative opportunities for today's digitalized energy systems - a field
      shaped by increasing decentralization, sector coupling, and digitalization. In this talk, Astrid Nieße will
      explore how agent-based paradigms empower complex energy networks to become more flexible, resilient, and
      adaptive. She will outline methods for designing distributed artificial intelligence and leveraging
      autonomous software agents to manage the huge number of decentralized assets, such as batteries, electric
      vehicles, and flexible industrial loads in cyber-physical energy systems. Highlights will include the
      simulation of and challenges in real-world deployment of multi-agent systems, e.g. for grid stability. The
      talk will also address algorithmic advances such as distributed optimization, tackling both technical and
      regulatory challenges posed by future energy infrastructures.
    bio: >-
      Prof. Dr.-Ing. Astrid Nieße is a researcher in digitalized energy systems and energy informatics at Carl von
      Ossietzky University Oldenburg and serves on the board of OFFIS Institute for Information Technology. She
      focuses on advancing agent-based control, distributed artificial intelligence, and digital resilience in
      multimodal energy systems. Her research covers the modeling of energy system flexibility, integration of
      decentralized renewables, and pioneers self-organizing, resilient infrastructures that respond adaptively to
      grid fluctuations. As spokesperson for the German Informatics Society's Energy Informatics group and active
      member of ACM SIGEnergy, Prof. Nieße links interdisciplinary research and technology transfer, with notable
      contributions to sector coupling and resilience analysis. Additionally, as a spokesperson for NFDI4Energy,
      she drives the advancement of FAIR data and software for the German energy system research.

  - id: sanjab
    name: Anibal Sanjab
    affiliation: VITO & EnergyVille, Belgium
    role: keynote
    photo: /assets/img/2025/anibal-sanjab.jpg
    title: "TSO-DSO coordination for the procurement of flexibility services: market models, cooperation mechanisms, and grid constraints"
    abstract: >-
      The growing electrification of end-use sectors, from industry to commercial and residential users, is
      driving a sharp increase in electricity demand across all voltage levels of the grid. This surge intensifies
      the risk of congestion and voltage violations. Yet, the very technologies contributing to this rise in demand
      also hold the key to alleviating these challenges through their inherent flexibility. Flexible resources are
      increasingly emerging across both transmission and distribution networks, while the need for such flexibility
      is simultaneously growing for system operators at all levels. This evolving context underscores the crucial
      role of TSO–DSO coordination in the procurement and activation of flexibility services. In this lecture, we
      will examine different models for TSO–DSO coordinated flexibility markets that enable efficient and effective
      procurement of flexibility. We will compare joint procurement schemes with sequential market designs and
      investigate mechanisms that facilitate cooperation between TSOs and DSOs. Finally, we will discuss approaches
      to ensuring grid-secure flexibility activation, including the incorporation of network constraints through
      methods such as dynamic operating envelopes.
    bio: >-
      Anibal Sanjab is a Principal Researcher in Grids and Energy Markets at VITO and EnergyVille in Belgium, where
      he leads key European and Belgian research projects and various consulting assignments for national and
      European stakeholders. His research focuses on wholesale electricity markets, including long-term instruments
      and short-term markets, as well as on flexibility mechanisms such as flexibility markets, TSO-DSO
      coordination, network tariff design, and dynamic connection agreements. His work also covers sector coupling
      at both wholesale and end-user levels, energy sharing and renewable energy communities, and general power
      system operation, planning, and control. He develops mathematical models, tools, and concepts grounded in game
      theory, optimization, graph theory, and machine learning. Dr. Sanjab has authored and co-authored numerous
      journal and conference papers in these domains. He received the Best Paper Award at IEEE ISGT Europe 2024 and
      the Best Student Paper Award at IEEE SmartGridComm 2015. He is also a recipient of the Fulbright Scholarship
      (2012–2014). Dr. Sanjab holds a PhD in Electrical Engineering from Virginia Tech (Virginia, USA).

