tagline: Research Day and Christmas gathering

intro: |
  Welcome to the inaugural Electrical Energy Systems (EES) Research Day!

  With more than 120 members in our group, it can be challenging to stay fully connected with the wide range of work taking place around us. This event offers a valuable opportunity to gain an overview of our group's research activities while sharing a relaxed Christmas lunch together.

  We are pleased to host guest speakers from academia and industry, and we are also glad to welcome back some of our alumni, who will talk about their career paths, reflect on how EES shaped their journey, and inspire us with their stories.

  We hope the EES Research Day will become our new tradition and look forward to welcoming you on December 11!

