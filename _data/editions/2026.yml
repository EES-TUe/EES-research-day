welcome: Welcome to the second Electrical Energy Systems (EES) Research Day! # large lead text in the About section
intro: |
  After a successful first edition in 2025, we are glad to bring the group together again for a day of research talks, guest speakers, alumni stories and group activities. It is a chance to see what our colleagues are working on, reconnect with former EES members and share a lunch together in a festive atmosphere.

