# EES Research Day 2026 — draft programme. Anything marked tbc: true shows a "TBC" badge.
year: 2026
date: 2026-12-16
start_time: "09:00"
end_time: "17:00"
status: upcoming          # upcoming | past — "past" turns the page into an archive and hides registration

intro: |
  Welcome to the second Electrical Energy Systems (EES) Research Day!

  After a successful first edition in 2025, we are glad to bring the group together again for a day of research talks, guest speakers, alumni stories and group activities. It is a chance to see what our colleagues are working on, reconnect with former EES members and share a relaxed lunch together.

# Registration happens inside the EES Employee environment in Microsoft Teams — there is no external form.
registration:
  intro: >-
    Registration for the EES Research Day 2026 goes through the **EES Employee** environment in Microsoft Teams.
    There is no separate sign-up form on this website.
  deadline:               # e.g. 2026-12-04 — leave empty to hide
  teams_link:             # optional deep link to the Teams channel/post/form — leave empty to hide the button
  steps:
    - Open **Microsoft Teams** and sign in with your TU/e account.
    - Go to the **EES Employee** team.
    - Find the **EES Research Day 2026** registration post and follow the instructions there. _(Details TBC.)_
  notes:

