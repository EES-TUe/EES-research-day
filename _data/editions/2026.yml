speakers_heading: Speakers
speakers:
  - id: pemen
    name: Guus Pemen
    affiliation: TU/e EES
    role: EES group chair
    title: "EES: past, present and the future"
    photo: /assets/img/speakers/Guus.jpg
    abstract: |
      Guus Pemen opens the day with a look at the EES group as a whole: how it started and grew over the years, where it stands in 2026 in terms of people, research themes, funding, publications and student projects, and its vision and plans for the years ahead.
  - id: ishchenko
    name: Anton Ishchenko
    affiliation: Phase to Phase
    role: Guest speaker
    title: "Power system computations: from EES to industrial practice"
    photo: /assets/img/speakers/ishchenko.png
    email: anton.ishchenko@phasetophase.nl
    logo: /assets/img/logos/phase-to-phase.png
    logo_url: https://www.phasetophase.nl/en/team/
    abstract: |
      What happens to power system theory once it leaves the university? In this talk I combine my own path, from a PhD at EES to R&D at Phase to Phase, with an overview of how power system computations are developed and applied in industry. I will introduce the Vision and Gaia software and discuss selected practical cases from industrial and utility projects, such as arc flash, power quality and harmonic mitigation, and protection settings. Along the way I will highlight where academic knowledge proved essential, where practice demanded something different, and which challenges could be interesting topics for future research.
    bio: |
      Anton Ishchenko received an MSc. in Electrical Engineering from the Kuban State Technological University (Krasnodar, Russia) in 2002. In 2003 he joined the Eindhoven University of Technology, Netherlands where he finished his PhD thesis in the field of power system dynamics and stability in 2008. Until September 2009 he worked as a Postdoctoral Researcher involved in the EU FP6 Virtual Synchronous Generator (VSYNC) project at the same university. Since October 2009, he has been working as a Researcher at Phase to Phase B.V. company (Arnhem, Netherlands) developing software for power system computations. His current activities include:

      * definition of R&D vision of the company;
      * development and programming of models and algorithms for power system computations in company’s software;
      * management and supervision of collaboration with research institutes and universities.
  - id: khosravi
    name: Nika Khosravi
    affiliation: Institute for Automation of Complex Power Systems, RWTH Aachen University
    role: Guest speaker
    logo: /assets/img/logos/RWTH.png
    logo_url: https://www.acs.eonerc.rwth-aachen.de/cms/e-on-erc-acs/das-institut/mitarbeiter/advanced-machine-learning-solutions/~brnmxj/khosravi-nika/?allou=1&lidx=1
    title: "AI in grid operations projects (AI.Grids, SG: SKILL and FAIR4Communities)"
    photo: /assets/img/speakers/khosravi.png
    email: nika.khosravi@eonerc.rwth-aachen.de

